<script>
(function() {
  const currentPath = window.location.pathname;
  const isTurkish = currentPath.startsWith('/tr/');
  
  function getTurkishPath(path) {
    if (path === '/') return '/tr/';
    if (path.startsWith('/en/')) {
      return path.replace('/en/', '/tr/');
    }
    // Blog post URLs: /2022/04/11/title/ -> /2022/04/11/title-tr/
    if (path.match(/^\/\d{4}\/\d{2}\/\d{2}\/[^\/]+\/$/)) {
      const parts = path.split('/');
      const title = parts[parts.length - 2];
      // Don't add -tr if it already exists
      if (title.endsWith('-tr')) {
        return path;
      }
      return path.replace('/' + title + '/', '/' + title + '-tr/');
    }
    // Regular pages: /blog/ -> /tr/blog/
    if (path.startsWith('/blog/') || path.startsWith('/projects/') || 
        path.startsWith('/talks/') || path.startsWith('/about/')) {
      return '/tr' + path;
    }
    if (path.endsWith('/') && !path.startsWith('/tr/')) {
      return '/tr' + path;
    }
    if (!path.endsWith('/') && !path.startsWith('/tr/')) {
      return '/tr' + path + '/';
    }
    return path;
  }
  
  function getEnglishPath(path) {
    if (path === '/tr/') return '/';
    if (path.startsWith('/tr/')) {
      let newPath = path.replace('/tr/', '/');
      // Blog post URLs: /2022/04/11/title-tr/ -> /2022/04/11/title/
      if (newPath.match(/\/\d{4}\/\d{2}\/\d{2}\/[^\/]+-tr\/$/)) {
        newPath = newPath.replace(/-tr\/$/, '/');
      }
      return newPath;
    }
    // Blog post URLs without /tr/: /2022/04/11/title-tr/ -> /2022/04/11/title/
    if (path.match(/^\/\d{4}\/\d{2}\/\d{2}\/[^\/]+-tr\/$/)) {
      return path.replace(/-tr\/$/, '/');
    }
    return path;
  }
  
  function switchLanguage() {
    const currentPath = window.location.pathname;
    let newPath;
    
    // Update isTurkish check based on current path
    const currentIsTurkish = currentPath.startsWith('/tr/') || 
                             (currentPath.match(/^\/\d{4}\/\d{2}\/\d{2}\/[^\/]+-tr\/$/) !== null);
    
    if (currentIsTurkish) {
      newPath = getEnglishPath(currentPath);
    } else {
      newPath = getTurkishPath(currentPath);
    }
    
    window.location.href = newPath;
  }
  
  function updateUIText(lang) {
    document.querySelectorAll('[data-en][data-tr]').forEach(el => {
      el.textContent = lang === 'tr' ? el.getAttribute('data-tr') : el.getAttribute('data-en');
    });
    
    const searchInput = document.getElementById('header-search-input');
    if (searchInput) {
      searchInput.placeholder = lang === 'tr' ? 'Ara...' : 'Search...';
    }
    
    const langSelector = document.getElementById('language-selector');
    if (langSelector) {
      const currentLang = langSelector.querySelector('#current-lang');
      const switchLang = langSelector.querySelector('#switch-lang');
      if (lang === 'tr') {
        currentLang.textContent = 'TR';
        switchLang.textContent = 'EN';
      } else {
        currentLang.textContent = 'EN';
        switchLang.textContent = 'TR';
      }
    }
  }
  
  document.addEventListener('DOMContentLoaded', function() {
    const switchLangBtn = document.getElementById('switch-lang');
    if (switchLangBtn) {
      switchLangBtn.addEventListener('click', function(e) {
        e.preventDefault();
        switchLanguage();
      });
    }
    
    // Check if current page is Turkish (either /tr/ prefix or -tr suffix in blog posts)
    const currentPath = window.location.pathname;
    const currentIsTurkish = currentPath.startsWith('/tr/') || 
                             (currentPath.match(/^\/\d{4}\/\d{2}\/\d{2}\/[^\/]+-tr\/$/) !== null);
    
    updateUIText(currentIsTurkish ? 'tr' : 'en');
    
    if (currentIsTurkish) {
      document.documentElement.lang = 'tr';
    }
  });
})();
</script>
