# Site settings
title: Yunus Aydın Blog
description: Security researcher exploring cybersecurity, vulnerability research, and responsible disclosure. Discover CVEs, conference talks, and security research.
author: Yunus Aydın
url: https://aydinnyunus.github.io
baseurl: ""
default_image: "https://avatars.githubusercontent.com/u/52822869?s=1200&v=4"

# Jekyll settings
# theme: minima  # Theme not required for GitHub Pages automatic build
plugins:
  - jekyll-feed
  - jekyll-sitemap

# Feed settings
feed:
  path: feed.xml
  excerpt_only: true

# Blog settings
permalink: /:year/:month/:day/:title/
paginate: 5
paginate_path: "/blog/page:num/"
future: true

# Markdown settings
markdown: kramdown
kramdown:
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: 'highlight'

# Exclude settings
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - README.md

