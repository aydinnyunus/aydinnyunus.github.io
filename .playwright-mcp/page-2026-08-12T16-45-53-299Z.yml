        - paragraph [ref=e176]: Captchas evolved from distorted text to more challenging tasks involving images or visual puzzles as bad actors gained access to algorithms better at making sense of visual data. Tricky visual captchas can now be solved by AI, too, whether that’s a general purpose chatbot like OpenAI’s ChatGPT or specialized captcha-solving bots used by spammers, which can solve them more quickly.
        - paragraph [ref=e177]: Visual captchas are now becoming an endangered species, according to security experts. Online services increasingly distinguish people from machines by invisibly collecting signals from your online activity. That can include whether you move your mouse in organically wobbly movements or rigid, robot-straight lines, or if you access the internet via a network with a history of being used by spammers.
        - paragraph [ref=e178]: Even when you do see a visual captcha today, signals harvested from the way you click might be more important than whether you actually solve the puzzle. Here’s a taste of the data the latest captchas can track.
        - generic [ref=e180]:
          - paragraph [ref=e181]: How you and ChatGPT looked while solving five captchas
          - paragraph [ref=e182]: Humans and bots use computers differently, leaving invisible signals that websites can use to differentiate between them.
