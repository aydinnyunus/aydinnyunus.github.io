        - paragraph [ref=e207]: “A lot of people have in their head this shorthand of ‘a captcha is a visual challenge,’” said Eric Mill, a security lead at Wikimedia Foundation, the nonprofit that hosts Wikipedia. “That is sort of the least interesting part of what bot detection is.” This year, the online encyclopedia ditched its squiggly letter captcha in favor of hCaptcha, a service that mostly uses behavioral analysis and only serves visual challenges to about 1 in 1,000 users.
        - paragraph [ref=e208]:
          - text: While it may not be obvious, every human browsing the internet does so alongside invisible hordes of bots, some nefarious and others benign. Last July, Cloudflare, one of the largest internet infrastructure providers,
          - link "estimated" [ref=e209] [cursor=pointer]:
            - /url: https://blog.cloudflare.com/from-googlebot-to-gptbot-whos-crawling-your-site-in-2025/?itid=lk_inline_enhanced-template
          - text: that bots accounted for about 30 percent of global web traffic; now, it’s
          - link "around" [ref=e210] [cursor=pointer]:
            - /url: https://radar.cloudflare.com/traffic?dateRange=52w&itid=lk_inline_enhanced-template
          - text: 60 percent.
        - generic [ref=e211]: Advertisement
        - paragraph [ref=e215]:
          - text: It’s hard to pin down exactly how quickly visual puzzles are disappearing. A spokesperson for hCaptcha said that fewer than 1 in 100 “real people” are served visual captchas on the service. Many major websites, such as LinkedIn, X and ChatGPT, run through Cloudflare, which has staked itself as a captcha-free security solution and may account for as much as 24 percent of all websites on the internet,
          - link "according" [ref=e216] [cursor=pointer]:
            - /url: https://w3techs.com/technologies/details/cn-cloudflare?itid=lk_inline_enhanced-template
          - text: to the survey company W3 Techs.
        - paragraph [ref=e217]: “Visual captchas suck,” said Bryan Becker, who leads security work at Cloudflare. “They’re not fun, and they’re easier to defeat. Modern captchas rely more on the behavioral signals and technical signals from the device itself.”
        - paragraph [ref=e218]:
          - text: Creating a good captcha is like designing a bear-proof trash bin, said Andreas Plesner, a PhD student at Swiss Federal Institute of Technology at Zurich, who created a custom AI model to
          - link "test the robustness" [ref=e219] [cursor=pointer]:
            - /url: https://arxiv.org/abs/2409.08831?itid=lk_inline_enhanced-template
          - text: of Google’s “I’m not a robot” checkbox in 2024. Ideally, they should keep out the smartest and strongest attackers, while allowing in the least capable humans.
        - paragraph [ref=e220]: Unlike bears, software has gotten significantly more capable over the past couple of decades, forcing constant upgrades to captchas. The aim is to make them tricky enough to raise the costs for those in the business of spamming or attacking websites.
        - paragraph [ref=e221]:
          - text: In 2000, researchers at Carnegie Mellon University developed
          - link "Gimpy" [ref=e222] [cursor=pointer]:
            - /url: http://www.captcha.net/captchas/gimpy/?itid=lk_inline_enhanced-template
          - text: ", a captcha featuring distorted text that was used by Yahoo! to keep bots out of chatrooms. Two years later, a team at the University of California at Berkeley"
          - link "developed" [ref=e223] [cursor=pointer]:
            - /url: https://newsarchive.berkeley.edu/news/media/releases/2002/12/10_gimpy.html?itid=lk_inline_enhanced-template
          - text: software that could solve the puzzle about 30 percent of the time.
        - generic [ref=e224]: Advertisement
        - paragraph [ref=e228]:
          - text: In 2014, Google rolled out its “I’m not a robot” checkbox, which falls back to an image-based challenge if the system still doubts a user is human. By 2016, researchers at Columbia University had found a way to
          - link "break through" [ref=e229] [cursor=pointer]:
            - /url: https://blackhat.com/docs/asia-16/materials/asia-16-Sivakorn-Im-Not-a-Human-Breaking-the-Google-reCAPTCHA-wp.pdf?itid=lk_inline_enhanced-template
          - text: about 70 percent of the time.
        - paragraph [ref=e230]:
          - text: The cat-and-mouse game continues, with some bots now programmed to mimic human
          - link "mouse movements" [ref=e231] [cursor=pointer]:
            - /url: https://precursor-trace.cloudflare.app/?itid=lk_inline_enhanced-template
          - text: with curved motions or random tremors. Companies like Cloudflare collect information such as the history and characteristics of your browser, looking for signs a visitor is a bot using a “headless” browser controlled by code, not a person looking at a screen. (Google rolled out this method in 2018.)
        - generic [ref=e232]: Advertisement
        - paragraph [ref=e236]: Captcha designers are switching tactics in response, and also grappling with the way AI can now handle a much wider range of puzzles. Some companies have still opted to keep visual challenges, continuously modifying them.
        - paragraph [ref=e237]: “We have thousands of different challenge types, and we change them constantly,” said Kevin Gosschalk, CEO of Arkose Labs, which offers captchas and other tools to prevent online abuse. “The only way adversaries can try and keep up with us is if they have to invest a ton of money and build a system.”
        - paragraph [ref=e238]:
          - text: Website operators also have to contend with a new breed of AI bots. Chatbots offered by leading AI companies, like the makers of Claude and ChatGPT, can control a web browser to do tasks like filling forms or
          - link "navigate an online store" [ref=e239] [cursor=pointer]:
            - /url: https://www.washingtonpost.com/technology/2025/02/07/openai-operator-ai-agent-chatgpt/?itid=lk_inline_enhanced-template
          - text: . OpenAI said that its chatbot should tackle captchas only when doing so reflects a user’s intent. (The Washington Post has a content partnership with OpenAI.)
        - paragraph [ref=e240]: Websites often want to allow some of that new “agentic” traffic, for example when it’s a chatbot making a purchase on behalf of a human. But it can also be unwelcome, noted Becker of Cloudflare, if a bot is attempting to buy “every single shoe that I have in stock faster than a human can.” Cloudflare offers technology designed to help website operators tell the difference between desirable and unwanted browsing bots.
        - generic [ref=e241]: Advertisement
        - paragraph [ref=e245]:
          - text: Meanwhile, the challenges humans must solve to get around online continue to get trickier. In June, Google
          - link "rolled out a new captcha format" [ref=e246] [cursor=pointer]:
            - /url: https://docs.cloud.google.com/recaptcha/docs/hand-gesture-verification?itid=lk_inline_enhanced-template
          - text: that challenges a person to make hand gestures in front of their computer’s camera while software tracks their knuckles. It’s also testing one that asks a person to pull out their phone and scan a QR code.
