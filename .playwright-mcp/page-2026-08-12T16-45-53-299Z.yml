        - paragraph [ref=e99]: The internet puts all human knowledge at your fingertips — if you can click all the traffic lights, bicycles or birds to prove that you’re a person.
        - paragraph [ref=e100]:
          - text: The frustrating puzzles appear because companies try to block bots that can post spam or
          - link "snap up Taylor Swift tickets" [ref=e101] [cursor=pointer]:
            - /url: https://www.washingtonpost.com/business/2022/11/18/ticketmaster-taylor-swift-faq/?itid=lk_inline_enhanced-template
          - text: ", disadvantaging real customers or even crashing a website. The challenges are known as captchas, for Completely Automated Public Turing test to tell Computers and Humans Apart. And since they first appeared in the early 2000s, they’ve trapped internet users in a humans versus machines arms race."
        - paragraph [ref=e102]: Early captchas used simple visual challenges like distorted letters that were easy for humans to decipher but challenging for machines. As artificial intelligence software has gotten better, captchas have become more difficult in order to keep pace.
        - paragraph [ref=e103]: Try your hand at 25 years of captchas. Can you beat ChatGPT?
