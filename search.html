---
layout: default
title: Search
---

<div class="search-page">
  <h1>Search</h1>
  
  <div class="search-container">
    <input type="text" id="search-input" class="search-input" placeholder="Search posts..." autofocus>
    <div id="search-results" class="search-results"></div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const searchInput = document.getElementById('search-input');
  const searchResults = document.getElementById('search-results');
  
  // Get all posts data
  const posts = [
    {% for post in site.posts %}
    {
      title: {{ post.title | jsonify }},
      url: {{ post.url | relative_url | jsonify }},
      date: {{ post.date | date: "%B %d, %Y" | jsonify }},
      excerpt: {{ post.excerpt | default: "" | strip_html | jsonify }},
      content: {{ post.content | strip_html | jsonify }}
    }{% unless forloop.last %},{% endunless %}
    {% endfor %}
  ];
  
  function performSearch(query) {
    if (!query || query.trim().length === 0) {
      searchResults.innerHTML = '';
      return;
    }
    
    const lowerQuery = query.toLowerCase();
    const results = posts.filter(post => {
      const titleMatch = post.title.toLowerCase().includes(lowerQuery);
      const contentMatch = post.content.toLowerCase().includes(lowerQuery);
      const excerptMatch = post.excerpt && post.excerpt.toLowerCase().includes(lowerQuery);
      return titleMatch || contentMatch || excerptMatch;
    });
    
    if (results.length === 0) {
      searchResults.innerHTML = '<p class="no-results">No results found.</p>';
      return;
    }
    
    let html = '<ul class="search-results-list">';
    results.forEach(post => {
      const excerpt = post.excerpt || post.content.substring(0, 150);
      html += `
        <li class="search-result-item">
          <h3><a href="${post.url}">${post.title}</a></h3>
          <p class="search-result-meta">${post.date}</p>
          <p class="search-result-excerpt">${excerpt.substring(0, 150)}${excerpt.length > 150 ? '...' : ''}</p>
        </li>
      `;
    });
    html += '</ul>';
    searchResults.innerHTML = html;
  }
  
  // Debounce search
  let searchTimeout;
  searchInput.addEventListener('input', function() {
    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(() => {
      performSearch(this.value);
    }, 300);
  });
  
  // Handle Enter key
  searchInput.addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      performSearch(this.value);
    }
  });
});
</script>
